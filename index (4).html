<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de perfil: operacional ou analítico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #2B1A12;
    --muted: #6E5A4E;
    --line: #EBD3C8;
    --orange: #EE4D2D;
    --orange-deep: #D63A1B;
    --on-orange: #FFFFFF;
    --alt: #3D2314;
    --alt-ink: #FFFFFF;
    --peach: #F3B9A6;
    --focus: #0B5FFF;
    --sel-bg: #FFF1EC;
    --stage: transparent;
    --fam-body: "Calibri", "Carlito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --fam-head: "Montserrat", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; position: relative; overflow-x: hidden;
    background: var(--paper); color: var(--ink);
    font-family: var(--fam-body); font-size: 18px; line-height: 1.5;
  }
  .deco { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .deco i { position: absolute; display: block; border-radius: 50%; }
  .deco .d1 { width: 340px; height: 340px; right: -130px; top: -110px; background: rgba(238, 77, 45, .13); }
  .deco .d2 { width: 210px; height: 210px; left: -90px; bottom: 9%; border: 30px solid rgba(238, 77, 45, .11); }
  .deco .d3 { width: 64px; height: 64px; right: 7%; top: 52%; background: rgba(238, 77, 45, .16); }
  .deco .d4 { width: 150px; height: 150px; right: 4%; bottom: 3%; border-radius: 0;
    background-image: radial-gradient(rgba(238, 77, 45, .30) 2.5px, transparent 3px); background-size: 20px 20px; }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 20px 20px 56px; }
  .wrap.wide { max-width: 1060px; }
  h1, h2, h3 { font-family: var(--fam-head); font-weight: 700; line-height: 1.15; margin: 0; }
  h2 { font-size: 24px; }
  h3 { font-size: 19px; }
  p { margin: 0 0 14px; }
  .lead { color: var(--muted); font-size: 19px; max-width: 52ch; }
  .muted { color: var(--muted); }
  .small { font-size: 15px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  [hidden] { display: none !important; }

  /* Barra superior */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .topbar .left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chip { font-family: var(--fam-head); font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--sel-bg); border: 1.5px solid var(--line); }
  .chip.adm { background: var(--orange-deep); color: var(--on-orange); border-color: var(--orange-deep); }
  .tabs { display: flex; gap: 6px; }
  .tabs button { font-family: var(--fam-head); font-weight: 700; font-size: 14px; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .tabs button[aria-current="page"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .linkbtn { font-family: var(--fam-body); font-size: 16px; font-weight: 600; background: none; border: 0; color: var(--orange-deep); cursor: pointer; padding: 8px 4px; text-decoration: underline; }

  /* Mascote */
  .peek { display: flex; align-items: stretch; margin: 4px 0 26px; }
  .peek .stage { flex: 0 0 41%; max-width: 250px; background: var(--stage); border-radius: 18px 0 0 18px; }
  .peek .stage img { display: block; width: 100%; height: auto; }
  .peek .panel { flex: 1; min-width: 0; background: var(--orange-deep); color: var(--on-orange); border-radius: 0 18px 18px 0; padding: 18px 20px 18px 16px; display: flex; flex-direction: column; justify-content: center; }
  .peek .panel h1, .peek .panel h2 { font-size: clamp(21px, 5.6vw, 30px); overflow-wrap: anywhere; }
  .peek .panel p { margin: 10px 0 0; font-size: 18px; }
  .peek .panel .who { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .mini { display: flex; align-items: stretch; height: 68px; margin-bottom: 16px; }
  .mini .stage { flex: 0 0 auto; background: var(--stage); border-radius: 14px 0 0 14px; }
  .mini .stage img { display: block; height: 100%; width: auto; }
  .mini .panel { flex: 1; background: var(--orange-deep); color: var(--on-orange); border-radius: 0 14px 14px 0; display: flex; align-items: center; padding: 0 16px; font-family: var(--fam-head); font-weight: 700; font-size: 15px; }

  /* Formulários e botões */
  .field { margin: 18px 0 0; }
  .field label { display: block; font-weight: 700; margin-bottom: 6px; }
  .field input, .field select, .filters select, .filters input {
    width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 48px;
  }
  .field select:disabled { opacity: .55; }
  .hint { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .err { color: #B3261E; font-size: 16px; font-weight: 600; margin-top: 10px; min-height: 22px; }
  .btn { font-family: var(--fam-head); font-size: 15px; font-weight: 700; cursor: pointer; border-radius: 10px; padding: 13px 24px; border: 1.5px solid var(--orange-deep); background: var(--orange-deep); color: var(--on-orange); min-height: 48px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.sm { padding: 8px 14px; min-height: 38px; font-size: 13px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }

  /* Entrada */
  .gate { display: grid; gap: 12px; margin-top: 8px; }
  .choice { text-align: left; font: inherit; cursor: pointer; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px 18px; display: block; width: 100%; color: var(--ink); }
  .choice strong { display: block; font-family: var(--fam-head); font-size: 17px; margin-bottom: 4px; }
  .choice span { color: var(--muted); font-size: 17px; }
  .choice:hover, .choice[aria-expanded="true"] { border-color: var(--orange-deep); background: var(--sel-bg); }
  .admbox { margin-top: 6px; padding: 16px 18px 18px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); }

  /* Quiz */
  .progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 0 0 26px; }
  .progress i { height: 6px; border-radius: 3px; background: var(--line); }
  .progress i.on { background: var(--orange); }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  legend { padding: 0; margin: 0 0 20px; font-family: var(--fam-head); font-weight: 700; font-size: clamp(20px, 5vw, 25px); line-height: 1.3; }
  .opt { display: block; position: relative; margin-bottom: 10px; }
  .opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .opt span { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 15px 16px; }
  .opt span::before { content: ""; flex: 0 0 20px; height: 20px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--muted); }
  .opt input:checked + span { border-color: var(--orange-deep); background: var(--sel-bg); }
  .opt input:checked + span::before { border-color: var(--orange-deep); background: radial-gradient(circle, var(--orange-deep) 0 45%, transparent 50%); }
  .opt input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: var(--line); margin: 6px 0 10px; }
  .bar div { transition: width .6s ease; }
  .bar .a-l { background: var(--orange-deep); }
  .bar .a-a { background: var(--alt); }
  @media (prefers-reduced-motion: reduce) { .bar div { transition: none; } }
  .legend { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 16px; }
  .lg { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; margin-right: 14px; }
  .lg::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--c, var(--line)); }
  .legend .lg { margin: 0; }
  .section { margin-top: 30px; }
  .section h3 { margin-bottom: 10px; }
  ul.dev { margin: 0; padding-left: 22px; }
  ul.dev li { margin-bottom: 8px; }
  ul.dev li::marker { color: var(--orange); }
  details { border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); padding: 4px 16px; margin-top: 30px; }
  summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
  .ans { padding: 12px 0; border-top: 1px solid var(--line); }
  .ans small { color: var(--muted); display: block; margin-bottom: 2px; }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-top: 6px; }
  .tag.L { background: var(--orange-deep); color: var(--on-orange); }
  .tag.A { background: var(--alt); color: var(--alt-ink); }
  .tag.M { background: var(--line); color: var(--ink); }
  .note { margin-top: 28px; color: var(--muted); font-size: 15px; }
  .savemsg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--sel-bg); border: 1.5px solid var(--line); font-size: 16px; }

  /* Painel do administrador */
  .titlebar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .notice { background: var(--sel-bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; font-size: 16px; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; align-items: end; }
  .filters label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; border-top: 5px solid var(--c, var(--ink)); }
  .kpi b { display: block; font-family: var(--fam-head); font-size: 28px; line-height: 1.1; }
  .kpi span { font-size: 15px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .card { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 16px 18px 18px; min-width: 0; }
  .card h3 { margin-bottom: 4px; }
  .card .sub { color: var(--muted); font-size: 15px; margin-bottom: 12px; }
  .full { grid-column: 1 / -1; }
  .insights { margin: 0; padding-left: 20px; }
  .insights li { margin-bottom: 8px; }
  .insights li::marker { color: var(--orange); }
  .donutwrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .donut { width: 150px; height: 150px; flex: 0 0 auto; }
  .donut text { font-family: var(--fam-head); }
  .sbrow { margin-bottom: 12px; }
  .sbrow .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 16px; margin-bottom: 4px; font-weight: 600; }
  .sbrow .lab small { color: var(--muted); font-weight: 400; }
  .sb { display: flex; height: 24px; border-radius: 6px; overflow: hidden; background: var(--line); }
  .sb span { display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; overflow: hidden; }
  .sb .op { background: var(--orange-deep); }
  .sb .eq { background: var(--peach); color: var(--ink); }
  .sb .an { background: var(--alt); }
  .strip { width: 100%; min-width: 560px; height: auto; display: block; }
  .scroll-x { overflow-x: auto; }
  .strip text { font-family: var(--fam-body); fill: var(--muted); font-size: 12px; }
  .rank { list-style: none; margin: 0; padding: 0; }
  .rank li { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .rank li:first-child { border-top: 0; }
  .rank .pos { font-family: var(--fam-head); font-weight: 800; color: var(--orange-deep); }
  .rank .who small { display: block; color: var(--muted); font-size: 14px; }
  .rank .pc { font-family: var(--fam-head); font-weight: 700; font-size: 15px; }
  .rank .track { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .rank .track i { display: block; height: 100%; background: var(--c); }
  .grp { margin-top: 8px; }
  .grp h3 { margin: 18px 0 6px; }
  .grp .lider { font-weight: 700; margin: 12px 0 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tw { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: 16px; min-width: 520px; }
  th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  thead th { border-top: 0; font-size: 14px; color: var(--muted); font-weight: 700; background: var(--sel-bg); }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.op { background: var(--orange-deep); color: #fff; }
  .badge.an { background: var(--alt); color: #fff; }
  .badge.eq { background: var(--peach); color: var(--ink); }
  .badge.forte { margin-left: 6px; background: transparent; border: 1.5px solid currentColor; padding: 0 8px; }
  .mbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); min-width: 90px; }
  .mbar i:first-child { background: var(--orange-deep); }
  .mbar i:last-child { background: var(--alt); }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); }
  textarea.copy-fallback { position: fixed; opacity: 0; pointer-events: none; }
</style>
</head>

<div class="wrap" id="wrap">
  <div id="top"></div>
  <div id="app"></div>
</div>

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;

  }
  function donut(c) {
    var n = c.op + c.eq + c.an, r = 15.9155, offset = 25, parts = "";
    [["op", "var(--orange-deep)"], ["eq", "var(--peach)"], ["an", "var(--alt)"]].forEach(function (x) {
      var v = n ? c[x[0]] / n * 100 : 0;
      if (v > 0) { parts += '<circle r="' + r + '" cx="20" cy="20" fill="none" stroke="' + x[1] + '" stroke-width="6" stroke-dasharray="' + v + ' ' + (100 - v) + '" stroke-dashoffset="' + offset + '"></circle>'; offset -= v; }
    });
    return '<svg class="donut" viewBox="0 0 40 40" role="img" aria-label="Distribuição geral de perfis">' +
      '<circle r="' + r + '" cx="20" cy="20" fill="none" stroke="var(--line)" stroke-width="6"></circle>' + parts +

  }

  function stripPlot(rows) {
    var turnos = TURNOS.filter(function (t) { return rows.some(function (r) { return r.turno === t; }); });
    if (!turnos.length) return '<div class="empty">Sem dados para exibir.</div>';
    var X0 = 40, X1 = 580, rowsGeo = [], y = 14, W = 620;
    var out = "";
    turnos.forEach(function (t) {
      var list = rows.filter(function (r) { return r.turno === t; });
      var buckets = {}, maxStack = 1;
      list.forEach(function (r) { var b = Math.round(r.pa / 4); r._k = buckets[b] = (buckets[b] || 0) + 1; if (r._k > maxStack) maxStack = r._k; });
      var h = Math.max(46, maxStack * 12 + 26);
      rowsGeo.push({ t: t, list: list, y: y, h: h });
      y += h;
    });
    var H = y + 26;
    var xa = X0 + (X1 - X0) * 0.4, xb = X0 + (X1 - X0) * 0.6;
    out += '<rect x="' + xa + '" y="6" width="' + (xb - xa) + '" height="' + (H - 34) + '" fill="var(--peach)" opacity=".35"></rect>';
    rowsGeo.forEach(function (g) {

      out += '<line x1="' + X0 + '" x2="' + X1 + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)" stroke-width="1.5"></line>';

      g.list.forEach(function (r) {

      });
    });
    out += '<text x="' + X0 + '" y="' + (H - 6) + '">Mais operacional</text>';
    out += '<text x="' + X1 + '" y="' + (H - 6) + '" text-anchor="end">Mais analítico</text>';
    out += '<text x="' + ((xa + xb) / 2) + '" y="' + (H - 6) + '" text-anchor="middle">Equilibrado</text>';
    var leg = ALL_LEADERS.map(function (l, i) { return '<span class="lg" style="--c:' + LEADER_COLORS[i % LEADER_COLORS.length] + '">' + esc(l) + '</span>'; }).join("");

      '<div class="scroll-x"><svg class="strip" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Posição de cada colaborador entre perfil operacional e analítico, por turno">' + out + '</svg></div>';
  }

  function rankList(rows, key, color) {

        '<span class="pc">' + v + '%</span><span class="track"><i style="width:' + v + '%"></i></span></li>';
    }).join("") + '</ol>';

  function insightsFor(rows) {
    var out = [], n = rows.length; if (!n) return out;
    var c = counts(rows);
    out.push("Entre <b>" + n + "</b> respostas, <b>" + pct(c.op, n) + "%</b> têm perfil operacional, <b>" + pct(c.an, n) + "%</b> analítico e <b>" + pct(c.eq, n) + "%</b> equilibrado.");
    var tStats = TURNOS.map(function (t) { var l = rows.filter(function (r) { return r.turno === t; }); return { t: t, n: l.length, pa: avg(l, function (r) { return r.pa; }) }; }).filter(function (x) { return x.n > 0; });
    if (tStats.length > 1) {
      var most = tStats.slice().sort(function (a, b) { return b.pa - a.pa; })[0], least = tStats.slice().sort(function (a, b) { return a.pa - b.pa; })[0];
      if (most.t !== least.t) out.push("O turno <b>" + most.t + "</b> tem a maior tendência analítica (média de " + Math.round(most.pa) + "% analítico, " + most.n + " respostas) e o <b>" + least.t + "</b> a maior tendência operacional (média de " + Math.round(100 - least.pa) + "% operacional, " + least.n + " respostas).");
    }
    var lStats = ALL_LEADERS.map(function (l) { var x = rows.filter(function (r) { return r.lider === l; }); return { l: l, n: x.length, pa: avg(x, function (r) { return r.pa; }), list: x }; }).filter(function (x) { return x.n >= 2; });
    if (lStats.length > 1) {
      var la = lStats.slice().sort(function (a, b) { return b.pa - a.pa; })[0], lo = lStats.slice().sort(function (a, b) { return a.pa - b.pa; })[0];
      if (la.l !== lo.l) out.push("O time de <b>" + esc(la.l) + "</b> é o mais analítico (média de " + Math.round(la.pa) + "%, " + la.n + " respostas) e o de <b>" + esc(lo.l) + "</b> o mais operacional (média de " + Math.round(100 - lo.pa) + "%, " + lo.n + " respostas).");
    }
    lStats.forEach(function (x) {
      var cc = counts(x.list);
      if (x.n >= 3 && (cc.op === x.n || cc.an === x.n)) out.push("O time de <b>" + esc(x.l) + "</b> é homogêneo: todos têm perfil " + (cc.op === x.n ? "operacional" : "analítico") + ".");
    });
    var sa = rows.filter(function (r) { return r.pa >= STRONG; }), so = rows.filter(function (r) { return r.pl >= STRONG; });
    if (sa.length) out.push("<b>" + sa.length + "</b> colaborador(es) com perfil analítico forte (" + STRONG + "% ou mais), possíveis candidatos ao caminho de Assistente: " + esc(listNames(sa, 5)) + ".");
    if (so.length) out.push("<b>" + so.length + "</b> colaborador(es) com perfil operacional forte (" + STRONG + "% ou mais), possíveis candidatos ao caminho de Log2: " + esc(listNames(so, 5)) + ".");
    if (c.eq) out.push("<b>" + c.eq + "</b> colaborador(es) com perfil equilibrado: vale uma conversa 1:1 e um período de teste nos dois papéis antes de definir o caminho.");
    if (!state.filters.turno && !state.filters.lider && !state.filters.q) {
      var semT = TURNOS.filter(function (t) { return !rows.some(function (r) { return r.turno === t; }); });
      var semL = ALL_LEADERS.filter(function (l) { return !rows.some(function (r) { return r.lider === l; }); });
      if (semT.length) out.push("Ainda sem respostas no(s) turno(s): <b>" + semT.join(", ") + "</b>.");
      if (semL.length) out.push("Ainda sem respostas no time de: <b>" + esc(semL.join(", ")) + "</b>.");
    }
    return out;
  }

  function groupsHtml(rows) {
    if (!rows.length) return "";
    var html = "";
    TURNOS.forEach(function (t) {
      var inT = rows.filter(function (r) { return r.turno === t; });
      if (!inT.length) return;
      html += '<div class="grp"><h3>' + t + ' <span class="muted small" style="font-family:var(--fam-body);font-weight:400">' + inT.length + ' resposta(s)</span></h3>';
      LEADERS[t].forEach(function (l) {
        var inL = inT.filter(function (r) { return r.lider === l; }).sort(function (a, b) { return String(a.nome).localeCompare(String(b.nome), "pt-BR"); });
        if (!inL.length) { html += '<div class="lider">' + esc(l) + ' <span class="muted small" style="font-weight:400">sem respostas ainda</span></div>'; return; }
        var cc = counts(inL);
        html += '<div class="lider">' + esc(l) + ' <span class="muted small" style="font-weight:400">' + inL.length + ' resposta(s): ' + cc.op + ' operacional, ' + cc.eq + ' equilibrado, ' + cc.an + ' analítico</span></div>' +
          '<div class="tw"><table><thead><tr><th>Colaborador</th><th>Perfil</th><th>Operacional / Analítico</th><th>Data</th><th></th></tr></thead><tbody>' +
          inL.map(function (r) {
            var strong = (r.perfil === "op" && r.pl >= STRONG) || (r.perfil === "an" && r.pa >= STRONG);
            return '<tr><td>' + esc(r.nome) + '</td><td><span class="badge ' + r.perfil + '">' + PNAME[r.perfil] + '</span>' + (strong ? '<span class="badge forte ' + r.perfil + '" style="color:' + (r.perfil === "op" ? "var(--orange-deep)" : "var(--alt)") + '">forte</span>' : "") + '</td>' +
              '<td><div class="mbar" title="' + r.pl + '% operacional, ' + r.pa + '% analítico"><i style="width:' + r.pl + '%"></i><i style="width:' + r.pa + '%"></i></div><span class="small muted">' + r.pl + '% / ' + r.pa + '%</span></td>' +
              '<td>' + fmtDate(r.ts) + '</td><td><button class="btn ghost sm" data-del="' + esc(r.id) + '">Excluir</button></td></tr>';
          }).join("") + '</tbody></table></div>';
      });
      html += '</div>';
    });
    return html;
  }

  function renderDash() {
    var host = document.getElementById("dash");
    if (!host) return;
    if (!state.loaded && !state.dbErr) { host.innerHTML = '<div class="empty">Carregando respostas…</div>'; return; }
    var rows = filtered(), n = rows.length, c = counts(rows);
    if (!state.resp.length) {
      host.innerHTML = '<div class="card empty">Ainda não há respostas registradas. Assim que os colaboradores concluírem o quiz, elas aparecem aqui.</div>';
      return;
    }
    if (!n) { host.innerHTML = '<div class="card empty">Nenhuma resposta com esses filtros.</div>'; return; }
    var ins = insightsFor(rows);
    var byTurno = TURNOS.map(function (t) { var l = rows.filter(function (r) { return r.turno === t; }); return l.length ? stackRow(t, l.length + " resposta(s)", counts(l)) : ""; }).join("");
    var byLider = ALL_LEADERS.map(function (l) { var x = rows.filter(function (r) { return r.lider === l; }); return x.length ? stackRow(l, x.length + " resposta(s)", counts(x)) : ""; }).join("");
    host.innerHTML =
      '<div class="kpis">' +
        '<div class="kpi" style="--c:var(--ink)"><b>' + n + '</b><span>Respostas</span></div>' +
        '<div class="kpi" style="--c:var(--orange-deep)"><b>' + pct(c.op, n) + '%</b><span>Operacional (' + c.op + ')</span></div>' +
        '<div class="kpi" style="--c:var(--peach)"><b>' + pct(c.eq, n) + '%</b><span>Equilibrado (' + c.eq + ')</span></div>' +
        '<div class="kpi" style="--c:var(--alt)"><b>' + pct(c.an, n) + '%</b><span>Analítico (' + c.an + ')</span></div>' +
      '</div>' +
      '<div class="grid"><div class="card full"><h3>Insights gerenciais</h3><div class="sub">Gerados automaticamente a partir das respostas filtradas.</div><ul class="insights">' + ins.map(function (i) { return "<li>" + i + "</li>"; }).join("") + '</ul></div></div>' +
      '<div class="grid">' +
        '<div class="card"><h3>Perfil geral</h3><div class="sub">Distribuição das respostas</div><div class="donutwrap">' + donut(c) + '<div>' + legendHtml() + '</div></div></div>' +
        '<div class="card"><h3>Perfil por turno</h3><div class="sub">Quantidade de respostas por perfil</div>' + legendHtml() + byTurno + '</div>' +
        '<div class="card"><h3>Perfil por líder</h3><div class="sub">Quantidade de respostas por perfil</div>' + legendHtml() + byLider + '</div>' +
      '</div>' +
      '<div class="grid"><div class="card full"><h3>Mapa dos colaboradores por turno</h3><div class="sub">Cada ponto é um colaborador, posicionado entre o perfil operacional (esquerda) e o analítico (direita). A faixa clara marca o perfil equilibrado.</div>' + stripPlot(rows) + '</div></div>' +
      '<div class="grid">' +
        '<div class="card"><h3>Ranking: mais analíticos</h3><div class="sub">Maior % de respostas no perfil analítico. Não mede desempenho.</div>' + rankList(rows, "an", "var(--alt)") + '</div>' +
        '<div class="card"><h3>Ranking: mais operacionais</h3><div class="sub">Maior % de respostas no perfil operacional. Não mede desempenho.</div>' + rankList(rows, "op", "var(--orange-deep)") + '</div>' +
      '</div>' +
      '<h2 style="margin:22px 0 4px">Respostas por turno e líder</h2>' + groupsHtml(rows);
    Array.prototype.forEach.call(host.querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () {
        if (b.getAttribute("data-arm") !== "1") {
          b.setAttribute("data-arm", "1"); b.textContent = "Confirmar exclusão";
          setTimeout(function () { if (b.isConnected) { b.removeAttribute("data-arm"); b.textContent = "Excluir"; } }, 4000);
          return;
        }
        b.disabled = true;
        api("/api/responses?id=" + encodeURIComponent(b.getAttribute("data-del")), { method: "DELETE", auth: true }).then(function (r) {
          if (r.ok) loadResponses(); else { b.disabled = false; b.textContent = "Erro ao excluir"; }
        }, function () { b.disabled = false; b.textContent = "Erro ao excluir"; });
      });
    });
  }

  function exportCsv() {
    var rows = filtered();
    if (!rows.length) return;
    function q(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
    var head = ["Nome", "Turno", "Líder", "Perfil", "% Operacional", "% Analítico", "Data"].concat(QUESTIONS.map(function (x, i) { return (i + 1) + ". " + x.tema; }));
    var lines = [head.map(q).join(";")];
    rows.forEach(function (r) {
      var letters = String(r.respostas || "").split("");
      lines.push([r.nome, r.turno, r.lider, PNAME[r.perfil], r.pl, r.pa, fmtDate(r.ts)].concat(QUESTIONS.map(function (x, i) { var k = letters[i]; return k === "L" ? "Operacional" : k === "A" ? "Analítico" : k === "M" ? "Meio-termo" : ""; })).map(q).join(";"));
    });
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "respostas-quiz-perfil.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ---------- roteamento ---------- */
  function render() {
    renderTop();
    wrap.classList.toggle("wide", state.mode === "admin" && state.tab === "acomp");
    if (!state.mode) renderGate();
    else if (state.mode === "admin" && state.tab === "acomp") renderAdmin();
    else if (state.quizView === "intro") renderIntro();
    else if (state.quizView === "question") renderQuestion();
    else renderResult();
    window.scrollTo(0, 0);
    var h = app.querySelector("[data-focus]"); if (h) h.focus();
  }

  render();
})();
</script>
</body>
</html>
